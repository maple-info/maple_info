<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메이플스토리 챗봇</title>
    <link href="/static/css/chatbot.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- 상단바 -->
    <header class="navbar">
        <a href="/">
            <img src="/static/image/m_logo.png" alt="Logo" class="logo-image">
        </a>
        <div class="navbar-search">
            <div class="search-container">
                <form action="{% url 'character_info:info' character_name='dummy' %}" method="GET">
                    <input id="input" name="character_name" type="text" placeholder="캐릭터닉네임" class="search-input">
                    <button type="submit" class="search-button">
                        <img src="/static/image/돋보기.png" alt="Search" class="search-icon">
                    </button>
                </form>
            </div>
        </div>
      </header>
      <div class="second-navbar"> 
        <ul class="navbar-menu"> 
            <li><a href="{% url 'main_home' %}">홈</a></li> 
            <li class="nav-link active"><a href="{% url 'chatbot' %}">CHAT BOT</a></li> 
            <li><a href="/">캐릭터검색</a></li> 
            <li><a href="#contact">랭킹</a></li> 
            {% if is_authenticated %}
            <li class="logout">
                <form method="post" action="{% url 'google_logout' %}">
                    {% csrf_token %}
                    <a href="#" class="toggle-button">내정보</a>
                    <a href="#" onclick="this.closest('form').submit(); return false;">
                        <button class="logout-button" type="button">로그아웃</button>
                    </a>
                </form>
            </li>
        {% else %}
            <li class="login">
                <form method="post" action="{% url 'google_login' %}">
                    {% csrf_token %}
                    <a href="#" onclick="this.closest('form').submit(); return false;">
                        <button type="button">로그인</button>
                    </a>
                </form>
            </li>
        {% endif %}
        </ul> 
    </div>
<main>
    <div id="left-box">
        <div class="title-box">
            <h1 class="title-text">CHAT BOT HISTORY</h1>
        </div>
        <div id="history">
            
        </div>
        <div id="character-info-container">
            <div id="search-results"></div>

            <form id="search-form" data-url="{% url 'search_character' %}">
                {% csrf_token %}
                <div class="input-container">
                    <input type="text" id="nickname" name="nickname" placeholder="캐릭터 검색" required>
                    <button type="submit">
                        <img src="/static/image/돋보기.png" alt="Search">
                    </button>
                </div>
            </form>
        
        </div>
    </div>

    <div id="chat-container">
   
        <div id="chat-box">
            <!-- 사용자 메시지 템플릿 -->
            <div id="user-template" class="message user-message" style="display: none;">
                <img src="/static/image/물의정령.png" alt="사용자" class="message-icon" style="max-width: 50px; max-height: 50px;">
                <div class="message-content"></div>
            </div>
        </div>
        <div id="bot-template" class="message bot-message">
            <div class="message-content"></div>
            <img src="/static/image/chatbot_image.png" alt="봇" class="message-icon">
        </div>
        <div id="chat-input">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <input type="text" id="message" placeholder="메이플에 관해서 궁금한게 있나요? 정령에게 메세지를 보내보세요!" value="{{ message }}" autocomplete="off">
            <button id="send">
                <img src="/static/image/말풍선.png" alt="전송" />
            </button>
        </div>
    </div>
    <div id="right-box">
        <!-- Right Box Content -->
    </div>
</main>

<!-- jQuery 추가 -->
<script>
    const searchCharacterUrl = "{% url 'search_character' %}";
</script>

<script src="/static/js/chatbot.js"></script>
</body>
</html>
